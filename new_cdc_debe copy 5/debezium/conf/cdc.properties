# ═══════════════════════════════════════════════════════════════════════════════
# Debezium Cassandra 4 Connector Configuration (UNCHANGED from v1)
# Version: 2.7.0.Final
#
# Topic naming: {topic.prefix}.{keyspace}.{table_name}
#   cdc.bidgely.users
#   cdc.bidgely.weather_data
#   cdc.bidgely.pilot_info        ← auto-detected (no whitelist needed)
#
# One Kafka message = one row mutation:
# {
#   "ts_ms": 1780297212683,
#   "op": "c",
#   "after": {
#     "key":     {"value": "ef9577a1...", "deletion_ts": null, "set": true},
#     "column2": {"value": "pilotId",    "deletion_ts": null, "set": true},
#     "value":   {"value": "AAAnlA==",   "deletion_ts": null, "set": true}
#   }
# }
# ═══════════════════════════════════════════════════════════════════════════════
 
connector.name=bidgely_cdc
 
# ─── Cassandra Connection ──────────────────────────────────────────────────────
cassandra.driver.config.file=/opt/debezium/conf/cassandra-driver.conf
cassandra.config=/etc/cassandra/cassandra.yaml
cassandra.port=9042
 
# ─── CDC Commit Log Processing ────────────────────────────────────────────────
# CRITICAL: Debezium moves processed logs here to prevent cdc_raw from filling up.
# If cdc_raw fills to cdc_total_space_in_mb, Cassandra rejects ALL writes to CDC tables.
commit.log.relocation.dir=/opt/debezium/data/reloc
 
# Cassandra 4.0: writes index file on every fsync → process immediately (not on segment close)
# Must be false for Cassandra 3.x
commit.log.real.time.processing.enabled=true
 
# ─── Kafka Producer ───────────────────────────────────────────────────────────
kafka.producer.bootstrap.servers=kafka:9092
kafka.producer.acks=all
kafka.producer.retries=5
kafka.producer.retry.backoff.ms=1000
kafka.producer.max.block.ms=30000
kafka.producer.linger.ms=10
kafka.producer.batch.size=65536
 
# ─── Topic Naming ─────────────────────────────────────────────────────────────
topic.prefix=cdc
 
# ─── Offset Tracking ──────────────────────────────────────────────────────────
# Debezium resumes from exact byte offset on restart
offset.backing.store.dir=/opt/debezium/data/offsets
 
# ─── Snapshot Mode ────────────────────────────────────────────────────────────
# initial : snapshot once on first run, then CDC only (correct)
# always  : re-snapshots on every restart → floods Kafka (never use in prod)
# never   : skip snapshot → misses rows that existed before CDC was enabled
snapshot.mode=initial
snapshot.consistency=ONE
 
# ─── Converters ───────────────────────────────────────────────────────────────
# JSON without embedded schema — lean payloads
# blob columns arrive base64-encoded in after.value field
# MUST match value.converter settings in Kafka Connect S3 Sink consumer
key.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false
 
# ─── HTTP Metrics ──────────────────────────────────────────────────────────────
http.port=8000