services:
 
  # ───────────────────────────────────────────────────────────────────────────
  # MINIO — S3-compatible object store
  #   bronze      : raw Debezium JSON (written by Kafka S3 Sink Connector)
  #   silver      : Delta Lake wide-format tables
  #   dead-letter : failed Spark batches for investigation
  # ───────────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: minio
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
 
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/${BRONZE_BUCKET} &&
        mc mb --ignore-existing local/${SILVER_BUCKET} &&
        mc mb --ignore-existing local/${DEAD_LETTER_BUCKET} &&
        echo '[minio-init] Buckets ready: ${BRONZE_BUCKET} + ${SILVER_BUCKET} + ${DEAD_LETTER_BUCKET}'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BRONZE_BUCKET: ${BRONZE_BUCKET}
      SILVER_BUCKET: ${SILVER_BUCKET}
      DEAD_LETTER_BUCKET: ${DEAD_LETTER_BUCKET}
    restart: "no"
 
  # ───────────────────────────────────────────────────────────────────────────
  # KAFKA — KRaft mode, no Zookeeper
  # ───────────────────────────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:${KAFKA_VERSION:-3.8.0}
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_MS: 604800000     # 7 days
      KAFKA_LOG_SEGMENT_BYTES: 134217728    # 128 MB
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
 
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
 
  # ───────────────────────────────────────────────────────────────────────────
  # CASSANDRA 4.0 — CDC enabled
  #   Three tables: users (EAV), weather_data (JSON_EMBEDDED), pilot_info (PLAIN)
  # ───────────────────────────────────────────────────────────────────────────
  cassandra:
    build:
      context: ./cassandra
    container_name: cassandra
    hostname: cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: test-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: RAC1
      CASSANDRA_ENDPOINT_SNITCH: SimpleSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra_data:/var/lib/cassandra
      - cassandra_config:/etc/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE CLUSTER' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
 
  cassandra-init:
    image: cassandra:4.0
    container_name: cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra/init:/init
    entrypoint: ["/bin/bash", "/init/01-init.sh"]
    restart: "no"
 
  # ───────────────────────────────────────────────────────────────────────────
  # DEBEZIUM — Standalone Cassandra 4 CDC connector (UNCHANGED from v1)
  #   Reads commit logs → produces to Kafka
  #   NOT a Kafka Connect source — standalone JVM with embedded producer
  #   Topics produced: cdc.bidgely.users, cdc.bidgely.weather_data,
  #                    cdc.bidgely.pilot_info (auto-detected)
  # ───────────────────────────────────────────────────────────────────────────
  debezium-connector:
    build:
      context: ./debezium
    container_name: debezium-connector
    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
    volumes:
      - ./debezium/conf:/opt/debezium/conf
      - cassandra_data:/var/lib/cassandra:ro
      - cassandra_config:/etc/cassandra:ro
      - debezium_data:/opt/debezium/data
    restart: on-failure
 
  # ───────────────────────────────────────────────────────────────────────────
  # KAFKA CONNECT — NEW in v2
  #   Runs the Confluent S3 Sink Connector
  #   ONE connector handles ALL topics via topics.regex
  #   Writes JSON Lines to s3://bronze/topics/{topic}/year=.../...
  #   Auto-discovers new topics matching "cdc\.bidgely\..+" within ~5 min
  # ───────────────────────────────────────────────────────────────────────────
  kafka-connect:
    build:
      context: ./connect
    container_name: kafka-connect
    hostname: kafka-connect
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # ── Connect framework ──────────────────────────────────────────────────
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: bidgely-s3-sink-group
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
 
      # ── Internal topic storage ─────────────────────────────────────────────
      # CRITICAL: replication factor MUST be 1 for single Kafka broker
      # Default is 3 — Connect crashes on startup without this
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
 
      # ── Converters — must match Debezium producer settings ─────────────────
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
 
      # ── Plugin path (S3 connector installed during image build) ─────────────
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
 
      # ── MinIO credentials — used by S3 Sink Connector via AWS SDK ──────────
      # EnvironmentVariableCredentialsProvider reads these automatically
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - connect_data:/var/lib/kafka/connect
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
 
  # ───────────────────────────────────────────────────────────────────────────
  # CONNECT-INIT — NEW in v2
  #   One-shot service that POSTs the S3 Sink Connector config
  #   to Kafka Connect REST API after Connect is healthy
  # ───────────────────────────────────────────────────────────────────────────
  connect-init:
    image: curlimages/curl:latest
    container_name: connect-init
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./connect/config:/connect-config:ro
    entrypoint: ["/bin/sh", "/connect-config/register_connector.sh"]
    environment:
      CONNECT_URL: http://kafka-connect:8083
    restart: "no"
 
  # ───────────────────────────────────────────────────────────────────────────
  # SPARK ETL — Generic Pipeline (rebuilt for v2)
  #   Source  : S3 Bronze (JSON files from Kafka S3 Sink Connector)
  #   Config  : table_config.yml (drives all table processing)
  #   Output  : S3 Silver (Delta Lake)
  #
  #   NOTE: No longer depends on Kafka — reads S3 directly
  #   NOTE: No longer writes Bronze — Connector owns Bronze layer
  # ───────────────────────────────────────────────────────────────────────────
  spark-etl:
    build:
      context: ./spark
    container_name: spark-etl
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # kafka dependency REMOVED — Spark reads S3, not Kafka
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      BRONZE_TOPICS_BASE: s3a://bronze/topics
      SILVER_BASE: s3a://silver
      TABLE_CONFIG_PATH: /opt/spark/jobs/table_config.yml
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      # spark_checkpoints volume removed — checkpoints stored in S3 (s3a://bronze/checkpoints/)
    restart: unless-stopped
 
volumes:
  kafka_data:
  cassandra_data:
  cassandra_config:
  minio_data:
  debezium_data:
  connect_data:
  spark_checkpoints:
 
networks:
  default:
    name: cdc-net
 