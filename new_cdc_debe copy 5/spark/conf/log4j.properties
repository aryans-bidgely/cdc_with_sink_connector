# ─────────────────────────────────────────────────────────────────────────────
# log4j.properties — suppress Spark internals, keep pipeline output clean
#
# Goal: docker compose logs spark-etl shows only:
#   - Our BATCH / STEP / BEFORE / AFTER print statements
#   - WARN and ERROR from Spark (real problems only)
#   - INFO from our pipeline loggers (generic_pipeline, generic_merge, etc.)
# ─────────────────────────────────────────────────────────────────────────────
 
# Root logger: WARN only — suppresses Spark's INFO flood
log4j.rootCategory=WARN, console
 
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{HH:mm:ss} [%p] %c{1}: %m%n
 
# ── Our pipeline loggers — keep at INFO so we see batch/step progress ─────────
log4j.logger.generic_pipeline=INFO, console
log4j.logger.generic_decoder=INFO, console
log4j.logger.generic_merge=INFO, console
log4j.logger.config_validator=INFO, console
log4j.logger.alerting=INFO, console
 
# ── Spark internals — WARN only ───────────────────────────────────────────────
log4j.logger.org.apache.spark=WARN, console
log4j.logger.org.apache.hadoop=WARN, console
log4j.logger.io.delta=WARN, console
log4j.logger.com.amazonaws=WARN, console
log4j.logger.org.apache.kafka=WARN, console
 
# ── Silence the noisiest Spark classes completely ─────────────────────────────
log4j.logger.org.apache.spark.storage.BlockManager=ERROR, console
log4j.logger.org.apache.spark.scheduler.DAGScheduler=ERROR, console
log4j.logger.org.apache.spark.executor.Executor=ERROR, console
log4j.logger.org.apache.spark.scheduler.TaskSetManager=ERROR, console
log4j.logger.org.apache.spark.ui=OFF