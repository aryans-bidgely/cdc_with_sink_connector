# ─────────────────────────────────────────────────────────────────────────────
# Spark defaults for Bidgely Generic CDC Pipeline (v2)
# ─────────────────────────────────────────────────────────────────────────────
 
# ── Delta Lake ────────────────────────────────────────────────────────────────
spark.sql.extensions                                    io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                         org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.databricks.delta.schema.autoMerge.enabled         true
spark.databricks.delta.autoOptimize.optimizeWrite       true
spark.databricks.delta.autoOptimize.autoCompact         true
 
# ── S3A / MinIO ───────────────────────────────────────────────────────────────
spark.hadoop.fs.s3a.path.style.access                   true
spark.hadoop.fs.s3a.impl                                org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled              false
spark.hadoop.fs.s3a.aws.credentials.provider            org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.connection.timeout                  30000
spark.hadoop.fs.s3a.socket.timeout                      30000
spark.hadoop.fs.s3a.attempts.maximum                    3
 
# ── Performance (Docker local mode) ──────────────────────────────────────────
spark.sql.shuffle.partitions                            4
spark.default.parallelism                               4
spark.sql.adaptive.enabled                              true
spark.ui.enabled                                        false
spark.sql.streaming.metricsEnabled                      true
 
# ── Timezone — explicit UTC prevents date partitioning inconsistencies ────────
spark.sql.session.timeZone                              UTC
 
# ── File Streaming ────────────────────────────────────────────────────────────
# How long to keep processed file logs before cleanup (ms)
spark.sql.streaming.fileSource.log.cleanupDelay         60000
 
# ── Logging — suppress Spark internals so pipeline print statements are visible ──
# Without this, Spark's own INFO logs (BlockManager, DAGScheduler, etc.)
# flood the output and bury the BATCH / STEP / BEFORE / AFTER traces.
spark.driver.extraJavaOptions                           -Dlog4j.configuration=file:/opt/spark/conf/log4j.properties